<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0c1013" />
    <meta
      name="description"
      content="JingHUB Express — a modern React + TypeScript + Tailwind storefront with KHQR / EMVCo scan-to-pay checkout."
    />
    <title>JingHUB Express — Modern Commerce, KHQR Checkout</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Read the persisted theme before first paint so the correct palette is applied immediately.
      (function () {
        try {
          var raw = localStorage.getItem("jinghub.preferences");
          var theme = raw ? JSON.parse(raw).state.theme : null;
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (theme === "dark" || (!theme && prefersDark)) {
            document.documentElement.classList.add("dark");
          }
        } catch (err) {
          /* storage unavailable — fall back to the light palette */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
